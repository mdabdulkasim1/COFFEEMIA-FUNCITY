<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Station</title>
<link rel="stylesheet" href="/css/pos.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { background: #1d1410; color: #fff; display: flex; flex-direction: column; font-family: "Nunito", "Segoe UI", system-ui, sans-serif; user-select: none; }
  #app { flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
  .st-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 22px; background: #2b1c14; }
  .st-top .code { font-size: 1.5rem; font-weight: 900; color: var(--yellow); } .st-top .name { font-size: 1.15rem; font-weight: 800; }
  .st-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 20px; text-align: center; }
  .lcd { width: min(640px, 100%); background: var(--lcd); color: var(--lcd-text); border-radius: 18px; padding: 20px 26px; font-family: ui-monospace, Menlo, Consolas, monospace; display: flex; justify-content: space-between; box-shadow: inset 0 0 40px rgba(0,0,0,.6); }
  .lcd .l { font-size: .8rem; letter-spacing: 3px; opacity: .75; text-align: left; } .lcd .v { font-size: 3.4rem; font-weight: 700; line-height: 1.05; }
  .lcd .r { text-align: right; } .lcd .v.big { font-size: 5.2rem; }
  .mins { display: flex; gap: 16px; width: min(640px, 100%); }
  .mins button { flex: 1; border: 0; border-radius: 18px; padding: 24px 10px; font-size: 1.7rem; font-weight: 900; cursor: pointer; background: var(--yellow); color: var(--ink); box-shadow: 0 6px 0 #b9821c; }
  .mins button:active { transform: translateY(4px); box-shadow: 0 2px 0 #b9821c; } .mins button.best { background: var(--pink); color: #fff; box-shadow: 0 6px 0 #a1325f; }
  .mins button small { display: block; font-size: 1rem; font-weight: 800; opacity: .85; }
  .mins button:disabled { opacity: .35; cursor: not-allowed; }
  .tap { width: min(640px, 100%); border: 3px dashed rgba(255,255,255,.5); border-radius: 18px; padding: 22px; font-size: 1.5rem; font-weight: 800; }
  .tap.pulse { animation: pulse 1.6s infinite; } @keyframes pulse { 0%, 100% { border-color: rgba(255,255,255,.35); } 50% { border-color: var(--yellow); } }
  .msg { font-size: 1.3rem; min-height: 1.6em; } .msg.err { color: #ff8a73; font-weight: 800; } .msg.ok { color: var(--lcd-text); font-weight: 800; }
  .headline { font-size: 2.4rem; font-weight: 900; } .headline.go { color: var(--lcd-text); } .headline.up { color: var(--pink); }
  .progress { width: min(640px, 100%); height: 10px; background: rgba(255,255,255,.12); border-radius: 99px; overflow: hidden; } .progress i { display: block; height: 100%; background: var(--yellow); transition: width 1s linear; }
  .st-foot { padding: 10px 22px; font-size: .85rem; opacity: .6; display: flex; justify-content: space-between; }
  .chooser { padding: 40px; max-width: 900px; margin: auto; }
  .chooser a { display: block; background: #2b1c14; color: #fff; text-decoration: none; padding: 16px 20px; border-radius: 12px; margin: 8px 0; font-weight: 800; font-size: 1.1rem; }
  .chooser a b { color: var(--yellow); margin-right: 10px; }
  .manual { position: fixed; left: 8px; bottom: 44px; opacity: .25; } .manual input { width: 170px; padding: 6px 8px; border-radius: 6px; border: 1px solid #555; background: #000; color: #fff; }
</style>
</head>
<body>
<div id="app"></div>
<div class="manual"><input id="manualUid" data-scan-target="1" type="text" placeholder="manual UID + Enter" autocomplete="off"></div>
<script type="module" src="/js/station.js"></script>
</body>
</html>
