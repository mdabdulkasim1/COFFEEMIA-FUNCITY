<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print play cards</title>
<link rel="stylesheet" href="/css/pos.css">
<style>
  :root { --cw: 85.6mm; --ch: 54mm; }
  .toolbar { background: var(--paper); border-bottom: 1px solid var(--line); padding: 12px 18px; display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; position: sticky; top: 0; z-index: 5; }
  .toolbar .field { margin: 0; min-width: 140px; }
  .sheet { display: grid; grid-template-columns: repeat(2, var(--cw)); gap: 6mm 8mm; justify-content: center; padding: 10mm; background: #fff; margin: 14px auto; width: 210mm; box-shadow: var(--shadow); }
  .pc { width: var(--cw); height: var(--ch); border-radius: 3.2mm; overflow: hidden; position: relative; break-inside: avoid; page-break-inside: avoid; font-family: "Nunito", "Segoe UI", system-ui, sans-serif; }
  .pc.front { background: var(--teal); color: #fff; padding: 4.5mm 5mm; }
  .pc.front .y { position: absolute; width: 30mm; height: 30mm; border-radius: 50%; background: var(--yellow); right: -8mm; top: -10mm; }
  .pc.front .p { position: absolute; width: 20mm; height: 20mm; border-radius: 50%; background: var(--pink); right: 10mm; bottom: -11mm; }
  .pc.front .t { font-size: 6.2mm; font-weight: 900; letter-spacing: .3mm; line-height: 1; position: relative; }
  .pc.front .b { font-size: 3mm; font-weight: 800; opacity: .9; margin-top: 1mm; position: relative; }
  .pc.front .bc { position: absolute; left: 5mm; bottom: 4.5mm; width: 52mm; height: 17mm; background: #fff; border-radius: 1.5mm; padding: 1mm 1.5mm; }
  .pc.front .bc svg { width: 100%; height: 100%; }
  .pc.front .tag { position: absolute; right: 5mm; bottom: 5mm; width: 20mm; font-size: 2.6mm; font-weight: 800; text-align: right; line-height: 1.25; }
  .pc.front .nm { position: absolute; left: 5mm; top: 17mm; font-size: 3mm; font-weight: 700; opacity: .95; max-width: 50mm; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pc.back { background: #fff; border: .4mm solid var(--line); color: var(--ink); padding: 4mm 5mm; font-size: 2.7mm; line-height: 1.35; }
  .pc.back h4 { margin: 0 0 1.5mm; font-size: 3.4mm; color: var(--teal); } .pc.back ul { margin: 0; padding-left: 4mm; } .pc.back .f { position: absolute; bottom: 3mm; left: 5mm; right: 5mm; font-size: 2.4mm; opacity: .7; display: flex; justify-content: space-between; }
  .pc.back .bcs { position: absolute; right: 5mm; bottom: 7mm; width: 26mm; } .pc.back .bcs svg { width: 100%; }
  @media print { @page { size: A4; margin: 8mm; } body { background: #fff; } .toolbar, #toasts { display: none !important; } .sheet { box-shadow: none; margin: 0; padding: 0; width: auto; } .pc.front { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
</style>
</head>
<body>
<div class="toolbar">
  <div class="field"><label>Reserve next numbers from POS</label><div class="row"><input id="count" type="number" min="1" max="200" value="10" style="width:90px"><button class="btn sm primary" id="reserve">Reserve &amp; show</button></div></div>
  <div class="field" style="flex:1;min-width:260px"><label>Or paste card numbers (one per line or comma separated)</label><input id="codes" type="text" placeholder="FC000001, FC000002"></div>
  <div class="field"><label>Name on card (optional)</label><input id="name" type="text" style="width:160px"></div>
  <div class="field"><label>Print</label><select id="side"><option value="front">Fronts only</option><option value="both">Fronts, then backs</option></select></div>
  <button class="btn sm" id="render">Show</button>
  <button class="btn sm yellow" id="print">🖨 Print</button>
  <span class="muted small">Card size 85.6 × 54 mm (CR80). 10 per A4 sheet. For backs, reload the printed sheets flipped on the long edge.</span>
</div>
<div id="out"></div>
<script type="module">
import { $, api, esc, toast } from '/js/common.js';
import { code128Svg } from '/js/barcode.js';
const qs = new URLSearchParams(location.search);
let settings = {};
const parse = s => String(s || '').split(/[\s,;]+/).map(x => x.trim().toUpperCase()).filter(Boolean);
function render(codes) {
  const name = $('#name').value.trim();
  const front = c => `<div class="pc front"><div class="y"></div><div class="p"></div><div class="t">PLAY CARD</div><div class="b">${esc(settings.brand || '')}</div>${name ? `<div class="nm">${esc(name)}</div>` : ''}<div class="bc">${code128Svg(c)}</div><div class="tag">Scan · Pick minutes · Play</div></div>`;
  const back = c => `<div class="pc back"><h4>${esc(settings.brand || '')} · Play Card rules</h4><ul><li>Prepaid only: buy and top up points at the counter.</li><li>Scan the card at any machine, pick 1 · 2 · 3 min. Points are taken when the timer starts.</li><li>Max ${esc(settings.max_minutes || 3)} min per turn when there is a queue.</li><li>Keep the card safe: anyone holding it can use the points.</li></ul><div class="bcs">${code128Svg(c, { height: 26, font: 10 })}</div><div class="f"><span>${esc(settings.receipt_header || '')}</span><span>${esc(c)}</span></div></div>`;
  const sheets = [];
  for (let i = 0; i < codes.length; i += 10) {
    const chunk = codes.slice(i, i + 10);
    sheets.push(`<div class="sheet">${chunk.map(front).join('')}</div>`);
    if ($('#side').value === 'both') {
      // mirror each row (2 columns) so backs line up after flipping on the long edge
      const mirrored = []; for (let r = 0; r < chunk.length; r += 2) mirrored.push(chunk[r + 1] ?? null, chunk[r]);
      sheets.push(`<div class="sheet">${mirrored.map(c => c ? back(c) : '<div class="pc"></div>').join('')}</div>`);
    }
  }
  $('#out').innerHTML = sheets.join('') || '<p class="muted" style="text-align:center;margin-top:40px">No card numbers yet.</p>';
}
$('#render').onclick = () => render(parse($('#codes').value));
$('#print').onclick = () => window.print();
$('#reserve').onclick = async () => {
  try { const { codes } = await api('POST', '/api/cards/next', { count: Number($('#count').value) }); $('#codes').value = codes.join(', '); render(codes); toast(`${codes.length} numbers reserved. Next will start after ${codes.at(-1)}.`, 'ok', 6000); }
  catch (e) { toast(e.message, 'error'); }
};
const b = await api('GET', '/api/bootstrap'); settings = b.settings; document.title = `${settings.brand} · Print play cards`;
if (qs.get('codes')) { $('#codes').value = qs.get('codes'); if (qs.get('no') && qs.get('no') !== qs.get('codes')) $('#name').value = ''; render(parse(qs.get('codes'))); setTimeout(() => window.print(), 400); }
</script>
</body>
</html>
